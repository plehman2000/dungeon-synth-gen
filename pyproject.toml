[project]
name = "dungeon-synth-gen"
version = "0.1.0"
description = "Procedural, seed-reproducible 8-bit dungeon synth music"
readme = "README.md"
authors = [
    { name = "Patrick Lehman", email = "54288924+plehman2000@users.noreply.github.com" }
]
requires-python = ">=3.13.5"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
]

[project.scripts]
dungeon-synth-gen = "dungeon_synth_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
